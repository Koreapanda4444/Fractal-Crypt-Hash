name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        working-directory: build
        run: make all

      - name: Tests
        working-directory: build
        run: |
          make test
          ./test_consistency
          ./test_boundaries
          ./test_invariants
          ./test_avalanche
          ./test_vectors
