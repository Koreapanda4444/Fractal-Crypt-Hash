name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            reference: true
          - os: ubuntu-latest
            compiler: clang
            reference: false
          - os: macos-latest
            compiler: clang
            reference: false
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        working-directory: build
        run: |
          make clean
          make all check check-extended bench-check CC="$CC"

      - name: Set up Python
        if: matrix.reference
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cross-check Python reference
        if: matrix.reference
        working-directory: build
        run: make check-reference

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run sanitizers
        working-directory: build
        run: |
          make clean
          make check check-extended \
            CC=clang \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run GCC static analyzer
        working-directory: build
        run: make analyze

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run libFuzzer smoke test
        working-directory: build
        run: make fuzz-smoke

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UCRT64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build and test
        shell: msys2 {0}
        working-directory: build
        run: |
          make clean
          make all check check-extended bench-check CC=gcc

  x86-32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Build and test
        working-directory: build
        run: |
          make clean
          make all check check-extended bench-check \
            CC=gcc \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -m32" \
            LDFLAGS="-m32"

  big-endian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PowerPC emulator and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc64-linux-gnu qemu-user

      - name: Build
        working-directory: build
        run: |
          make clean
          make fch test_consistency test_boundaries test_invariants \
            test_portability test_vectors test_failures \
            CC=powerpc64-linux-gnu-gcc \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"

      - name: Run under qemu
        working-directory: build
        run: |
          for test_bin in \
            test_consistency \
            test_boundaries \
            test_invariants \
            test_portability \
            test_vectors \
            test_failures
          do
            qemu-ppc64 -L /usr/powerpc64-linux-gnu "./$test_bin"
          done
