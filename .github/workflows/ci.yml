name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            reference: true
          - os: ubuntu-latest
            compiler: clang
            reference: false
          - os: macos-latest
            compiler: clang
            reference: false
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        working-directory: build
        run: |
          make clean
          make all check check-extended bench-check CC="$CC"

      - name: Set up Python
        if: matrix.reference
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Z3
        if: matrix.reference
        run: python -m pip install --disable-pip-version-check z3-solver==4.13.1.0

      - name: Cross-check Python reference
        if: matrix.reference
        working-directory: build
        run: make check-reference

      - name: Search reduced-round trails
        if: matrix.reference
        working-directory: build
        run: make check-trails

      - name: Search full-state characteristics
        if: matrix.reference
        working-directory: build
        run: make check-characteristics

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ASan and UBSan suites
        working-directory: build
        run: make sanitizer-check

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run GCC static analyzer
        working-directory: build
        run: make analyze

      - name: Run content timing check
        working-directory: build
        run: make timing-check

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUZZ_RUNS: "1024"
      FUZZ_TIMEOUT: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run five ASan and UBSan libFuzzer smoke targets
        working-directory: build
        run: |
          make clean
          make fuzz-smoke

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UCRT64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build and test
        shell: msys2 {0}
        working-directory: build
        run: |
          make clean
          make all check check-extended bench-check CC=gcc

      - name: Verify native Windows binary stdin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cli = (Resolve-Path ".\build\fch.exe").Path
          $inputPath = Join-Path $env:RUNNER_TEMP "fch binary input.bin"
          [byte[]] $inputBytes = @(
            0x0d, 0x0a, 0x1a, 0x00, 0xff, 0x46, 0x43, 0x48,
            0x80, 0x62, 0x69, 0x6e, 0x61, 0x72, 0x79, 0x0a
          )
          [IO.File]::WriteAllBytes($inputPath, $inputBytes)

          foreach ($bits in 256, 512) {
            $fileOutput = & $cli "-$bits" $inputPath
            if ($LASTEXITCODE -ne 0) {
              throw "FCH-$bits file input failed with exit code $LASTEXITCODE"
            }
            if ($fileOutput -match '^([0-9a-f]+)  ') {
              $fileDigest = $Matches[1]
            } else {
              throw "FCH-$bits file output is malformed"
            }

            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $cli
            $startInfo.ArgumentList.Add("-$bits")
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardInput = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.StandardInputEncoding = [Text.UTF8Encoding]::new($false)

            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) {
                throw "FCH-$bits stdin process did not start"
              }

              $inputStream = $process.StandardInput.BaseStream
              $inputStream.Write($inputBytes, 0, $inputBytes.Length)
              $inputStream.Close()
              $stdinOutput = $process.StandardOutput.ReadToEnd()
              $stderrOutput = $process.StandardError.ReadToEnd()
              $process.WaitForExit()
              $exitCode = $process.ExitCode
            } finally {
              $process.Dispose()
            }

            if ($exitCode -ne 0) {
              throw "FCH-$bits stdin failed with exit code ${exitCode}: $stderrOutput"
            }
            if ($stdinOutput.Trim() -match '^([0-9a-f]+)  -$') {
              $stdinDigest = $Matches[1]
            } else {
              throw "FCH-$bits stdin output is malformed"
            }

            if ($fileDigest -cne $stdinDigest) {
              throw "FCH-$bits file and stdin digests differ"
            }
            if ($fileDigest.Length -ne ($bits / 4)) {
              throw "FCH-$bits digest length is invalid"
            }
          }

  x86-32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Build and test
        working-directory: build
        run: |
          make clean
          make all check check-extended bench-check \
            CC=gcc \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -m32" \
            LDFLAGS="-m32"

  big-endian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PowerPC emulator and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc64-linux-gnu qemu-user

      - name: Build
        working-directory: build
        run: |
          make clean
          make fch test_consistency test_boundaries test_invariants \
            test_tree_boundaries test_stream_equivalence test_portability \
            test_vectors test_failures \
            CC=powerpc64-linux-gnu-gcc \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"

      - name: Run under qemu
        working-directory: build
        run: |
          for test_bin in \
            test_consistency \
            test_boundaries \
            test_tree_boundaries \
            test_stream_equivalence \
            test_invariants \
            test_portability \
            test_vectors \
            test_failures
          do
            qemu-ppc64 -L /usr/powerpc64-linux-gnu "./$test_bin"
          done
